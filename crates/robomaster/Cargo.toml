[package]
name = "robomaster"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
description = "RoboMaster 原生仿真启动器与本机网页服务"

[dependencies]
axum = { version = "0.8.9", default-features = false, features = ["http1", "tokio"] }
base64 = "0.22.1"
libc = "0.2.190"
serde_json = "1.0.151"
tokio = { version = "1.53.1", features = ["rt-multi-thread", "macros", "net", "process", "io-util", "sync", "time", "signal"] }

[dev-dependencies]
http-body-util = "0.1.3"
tower = { version = "0.5.3", features = ["util"] }
